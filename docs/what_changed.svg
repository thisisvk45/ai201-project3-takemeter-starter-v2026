  <text x="532" y="182" font-size="11" fill="#6B6B64" letter-spacing="0.4">ACCURACY</text>
  <text x="532" y="206" font-size="17" font-weight="600" fill="#4B54A8">0.733 to 0.778</text>
  <text x="532" y="244" font-size="12.5" fill="#4A4A45">experience up to 0.62 to 0.67.</text>
  <text x="532" y="263" font-size="12.5" fill="#4A4A45">Criteria 1 and 2 met on all</text>
  <text x="532" y="282" font-size="12.5" fill="#4A4A45">three seeds. Spread now 0.044.</text>
  <path d="M732 207.0 H753" stroke="#4B54A8" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="756" y="92" width="215" height="230" rx="10" fill="#FFFFFF" stroke="#E3E3DE" stroke-dasharray="5 4"/>
