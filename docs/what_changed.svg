  <rect x="0" y="0" width="1000" height="360" rx="14" fill="#FFFFFF" stroke="#E3E3DE"/>
  <text x="30" y="42" font-size="20" font-weight="600" fill="#1A1A18">What went wrong, and what I changed</text>
  <text x="30" y="66" font-size="13" fill="#6B6B64">One change at a time, each measured on seeds 42, 7 and 2024. Accuracy is the range across the three seeds.</text>
  <rect x="30" y="92" width="215" height="230" rx="10" fill="#F4F4F1" stroke="#8A8A82"/>
  <text x="48" y="124" font-size="15" font-weight="600" fill="#1A1A18">Before</text>
