  <text x="48" y="182" font-size="11" fill="#6B6B64" letter-spacing="0.4">ACCURACY</text>
  <text x="48" y="206" font-size="17" font-weight="600" fill="#1A1A18">0.512 on every seed</text>
  <text x="48" y="244" font-size="12.5" fill="#4A4A45">Every post called opinion.</text>
  <text x="48" y="263" font-size="12.5" fill="#4A4A45">Loss still falling at epoch 3,</text>
  <text x="48" y="282" font-size="12.5" fill="#4A4A45">so the model had barely moved.</text>
  <path d="M248 207.0 H269" stroke="#4B54A8" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="272" y="92" width="215" height="230" rx="10" fill="#F4F4F1" stroke="#8A8A82"/>
  <text x="290" y="124" font-size="15" font-weight="600" fill="#1A1A18">Fix 1</text>
  <text x="290" y="144" font-size="12" fill="#6B6B64">learning rate 0.00005</text>
  <text x="290" y="182" font-size="11" fill="#6B6B64" letter-spacing="0.4">ACCURACY</text>
  <text x="290" y="206" font-size="17" font-weight="600" fill="#1A1A18">0.610 to 0.780</text>
  <text x="290" y="244" font-size="12.5" fill="#4A4A45">question learned on all seeds.</text>
  <text x="290" y="263" font-size="12.5" fill="#4A4A45">experience still 0.00 everywhere:</text>
  <text x="290" y="282" font-size="12.5" fill="#4A4A45">only 21 training examples.</text>
  <path d="M490 207.0 H511" stroke="#4B54A8" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="514" y="92" width="215" height="230" rx="10" fill="#EEF0FB" stroke="#4B54A8"/>
  <text x="532" y="124" font-size="15" font-weight="600" fill="#2A2F6B">Fix 2</text>
