  <text x="774" y="182" font-size="11" fill="#6B6B64" letter-spacing="0.4">WORST LABEL: EVIDENCE</text>
  <text x="774" y="206" font-size="17" font-weight="600" fill="#1A1A18">F1 0.44 to 0.55</text>
  <text x="774" y="244" font-size="12.5" fill="#4A4A45">It learned links and tables,</text>
  <text x="774" y="263" font-size="12.5" fill="#4A4A45">not facts in plain prose.</text>
  <text x="774" y="282" font-size="12.5" fill="#4A4A45">Next: 30 prose evidence posts.</text>
  <text x="30" y="342" font-size="12" fill="#6B6B64">Labels, taxonomy and criteria stayed as filed in unit 5. Only the two declared changes moved.</text>
